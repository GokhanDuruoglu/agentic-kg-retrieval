[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-kg-retrieval"
version = "0.1.0"
description = "Modular agentic text-to-Cypher retrieval over knowledge graphs, with sparse / dense / GraphRAG baselines (2WikiMultihopQA)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Gökhan Duruoğlu", email = "gokhan.duruoglu@technarts.com" }]
keywords = ["knowledge graph", "agentic retrieval", "text-to-Cypher", "GraphRAG", "multi-hop QA"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.11,<3.12"
dependencies = [
  "openai==2.54.0",
  "tenacity==9.2.1",
  "neo4j==6.4.0",
  "tiktoken==0.12.0",
  "numpy==1.26.4",
  "scipy==1.17.1",
  "pandas==3.0.6",
  "pyyaml==6.0.3",
  "python-dotenv==1.2.4",
  "tabulate>=0.9",
]

[project.optional-dependencies]
# BM25, dense (E5) and GraphRAG-local retrieval
retrieval = [
  "rank-bm25==0.2.2",
  "sentence-transformers==5.2.3",
  "transformers==4.57.6",
  "torch==2.9.1",
  "faiss-cpu==1.12.0",
  "graspologic==3.4.4",
  "networkx==3.6.1",
]
# rebuilding the knowledge graph from the dataset (OpenIE, entity resolution, ...)
build = [
  "datasets==3.6.0",
  "pyarrow==19.0.1",             # pyarrow >= 20 needs numpy 2; the pipeline is pinned to numpy 1.26.4
  "sentence-transformers==5.2.3",
  "transformers==4.57.6",
  "torch==2.9.1",
]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/GokhanDuruoglu/agentic-kg-retrieval"

[project.scripts]
akg = "agentic_kg.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_kg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# graspologic 3.4.4 pins beartype<0.19, but works with the beartype the paper runs used.
override-dependencies = ["beartype==0.22.9"]
environments = ["sys_platform == 'linux'"]
